name: iOS build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test portable C++ core
        run: |
          clang++ \
            -std=c++17 \
            -Wall -Wextra -Werror -pedantic \
            -I Engine/Core \
            Engine/Tests/LegacyEngineCoreTests.cpp \
            -o /tmp/legacy-engine-core-tests
          /tmp/legacy-engine-core-tests

      - name: Test voxel world
        run: |
          clang++ \
            -std=c++17 \
            -Wall -Wextra -Werror -pedantic \
            -I Engine/Core \
            Engine/Tests/LegacyVoxelWorldTests.cpp \
            -o /tmp/legacy-voxel-world-tests
          /tmp/legacy-voxel-world-tests

      - name: Test voxel mesher
        run: |
          clang++ \
            -std=c++17 \
            -Wall -Wextra -Werror -pedantic \
            -I Engine/Core \
            Engine/Tests/VoxelMesherTests.cpp \
            -o /tmp/voxel-mesher-tests
          /tmp/voxel-mesher-tests

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/MinecraftLegacyMobile.xcodeproj \
            -scheme MinecraftLegacyMobile \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned app for physical iPhone
        run: |
          xcodebuild \
            -project ios/MinecraftLegacyMobile.xcodeproj \
            -scheme MinecraftLegacyMobile \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedDataDevice" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedDataDevice/Build/Products/Debug-iphoneos/MinecraftLegacyMobile.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/UnsignedIPA/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/UnsignedIPA/Payload/MinecraftLegacyMobile.app"
          cd "$RUNNER_TEMP/UnsignedIPA"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/MinecraftLegacyMobile-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftLegacyMobile-unsigned-IPA
          path: MinecraftLegacyMobile-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Launch app in iOS Simulator
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d["isAvailable"] and d["name"].startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator was found."
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/MinecraftLegacyMobile.app"
          xcrun simctl launch "$DEVICE_ID" fr.nolabjfjdj.minecraftlegacymobile
