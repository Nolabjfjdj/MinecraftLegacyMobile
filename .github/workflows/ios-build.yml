name: iOS build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test portable C++ core
        run: |
          clang++ \
            -std=c++17 \
            -Wall -Wextra -Werror -pedantic \
            -I Engine/Core \
            Engine/Tests/LegacyEngineCoreTests.cpp \
            -o /tmp/legacy-engine-core-tests
          /tmp/legacy-engine-core-tests

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/MinecraftLegacyMobile.xcodeproj \
            -scheme MinecraftLegacyMobile \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
